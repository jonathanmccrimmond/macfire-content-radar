name: Backfill card photos

# Manual one-button run: generate the relevant text-free background photo for
# any card that does not have one yet (or all cards with --force), re-render the
# branded images, rebuild the preview, and commit. Use this to fill in photos for
# the existing back catalogue without waiting for the next draft run.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate photos even for cards that already have one"
        required: false
        type: boolean
        default: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install Chromium (for card image rendering)
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Generate card photos
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          FLAGS="--all"
          if [ "${{ inputs.force }}" = "true" ]; then
            FLAGS="--all --force"
          fi
          python3 scripts/generate_card_photo.py $FLAGS

      - name: Rebuild preview
        run: python3 scripts/build_preview.py

      - name: Commit and push
        run: |
          git config user.name "MacFire Content Bot"
          git config user.email "noreply@macfireltd.co.uk"
          git add content/posts/ content/images/ preview/
          git diff --staged --quiet || git commit -m "content: backfill card photos [run $GITHUB_RUN_ID]"
          git push origin main
