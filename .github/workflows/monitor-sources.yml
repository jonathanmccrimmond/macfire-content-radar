name: Weekly source monitor

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 8am UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — detect new items without generating drafts"
        required: false
        type: boolean
        default: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install Chromium (for card image rendering)
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Run source monitor
        id: monitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="--dry-run"
          fi
          python3 scripts/monitor_sources.py $FLAGS

      - name: Generate card photos
        if: steps.monitor.outputs.drafts_generated != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: python3 scripts/generate_card_photo.py --all

      - name: Rebuild preview
        if: steps.monitor.outputs.drafts_generated != '0'
        run: python3 scripts/build_preview.py

      - name: Commit and push
        run: |
          git config user.name "MacFire Content Bot"
          git config user.email "noreply@macfireltd.co.uk"
          git add content/posts/ content/images/ preview/ monitor/last_seen.json
          git diff --staged --quiet || git commit -m "content: auto-generate drafts from weekly monitor [run $GITHUB_RUN_ID]"
          git push origin main
