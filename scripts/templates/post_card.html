<!DOCTYPE html>
<!--
  MacFire premium post card. Minimal on purpose: the photo carries the mood,
  with one short headline, the MacFire mark and the phone number. All copy is
  REAL text rendered here (never baked into the AI photo), so spelling and
  branding are always correct. Filled in by scripts/build_post_image.py.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root { --brand: #C31E1F; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; }
  body {
    font-family: "Liberation Sans", "DejaVu Sans", Arial, sans-serif;
    position: relative; overflow: hidden; background: #0b0e16;
  }
  .photo {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
  }
  /* Soft, premium gradient so text sits cleanly on the lower portion only. */
  .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(8,10,16,0) 40%,
      rgba(8,10,16,0.28) 58%,
      rgba(8,10,16,0.72) 80%,
      rgba(8,10,16,0.92) 100%
    );
  }
  .frame {
    position: absolute; inset: 0;
    padding: 84px;
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  .rule { width: 72px; height: 6px; background: var(--brand); border-radius: 3px; margin-bottom: 30px; }
  .headline {
    color: #fff; font-size: 70px; line-height: 1.05; font-weight: 800;
    letter-spacing: -0.02em; max-width: 92%;
    text-shadow: 0 2px 22px rgba(0,0,0,0.4);
  }
  .headline .hl { color: var(--brand); }
  .footer {
    margin-top: 52px; padding-top: 30px;
    border-top: 1px solid rgba(255,255,255,0.20);
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo { height: 74px; width: auto; display: block; border-radius: 4px; }
  .phone {
    color: #fff; font-size: 30px; font-weight: 800; letter-spacing: 0.01em;
    display: flex; align-items: center; gap: 14px;
  }
  .phone .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--brand); display: inline-block; }
</style>
</head>
<body>
  <div class="photo" style="background-image:url('{{BG}}')"></div>
  <div class="scrim"></div>
  <div class="frame">
    <div class="rule"></div>
    <div class="headline">{{HEADLINE}}</div>
    <div class="footer">
      {{LOGO}}
      <div class="phone"><span class="dot"></span>{{PHONE}}</div>
    </div>
  </div>
</body>
</html>
